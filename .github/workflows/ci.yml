name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

# Release only, everywhere: a Debug build of the same tree doubles a job for a
# configuration nothing ships, and the checks that need a Debug CRT or
# assertions are the local developer's. The iOS job still configures twice
# (device then simulator); pointing CPM at one cache directory means each
# archive is fetched once per job instead of once per configure, which keeps a
# flaky download from taking out the second half of a job that has already
# downloaded everything it needs.
env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal (arm64 + x86_64, min 11.0)
            os: macos-latest
            osx_archs: "arm64;x86_64"
            deployment_target: "11.0"
            pluginval: true

          - name: Windows MSVC (x64)
            os: windows-latest
            cc: cl
            cxx: cl
            msvc_arch: x64
            pluginval: true

          - name: Windows Clang (x64)
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            msvc_arch: x64
            pluginval: true

          # Native ARM64 runners, so the tests below run on real hardware
          # rather than being cross-compiled and skipped.
          - name: Windows MSVC (ARM64)
            os: windows-11-arm
            cc: cl
            cxx: cl
            msvc_arch: arm64

          - name: Windows Clang (ARM64)
            os: windows-11-arm
            cc: clang-cl
            cxx: clang-cl
            msvc_arch: arm64

          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            pluginval: true

          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      # The library's own ALSA sequencer MIDI backend needs the ALSA dev headers.
      # (miniaudio's other Linux deps — pthread, dl, m — ship with the toolchain.)
      # The plugin core links eacp, whose Linux graphics tier links Wayland,
      # xkbcommon, libdecor, xcb, FreeType, HarfBuzz and fontconfig and generates
      # its protocol bindings with wayland-scanner: eacp's own CI list. libcurl
      # is eacp-network's transport, which PluginValidator fetches with, and xvfb
      # is for pluginval, whose JUCE host wants an X server even headless.
      - name: Install Linux dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev xvfb \
            libwayland-dev wayland-protocols libwayland-bin libxkbcommon-dev \
            libdecor-0-dev pkg-config \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxcb-icccm4-dev libxcb-xinput-dev libxcb-xtest0-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev

      # Puts cl.exe / clang-cl.exe and the matching Windows SDK on
      # PATH/INCLUDE/LIB for the target architecture.
      - name: Set up MSVC environment
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Provides a recent CMake (the project requires >= 3.31) and Ninja
      # uniformly across all three OSes.
      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      # The Synth example's web editor runs npm install at configure and vite in
      # the build wherever eacp has a web runtime (macOS, Windows). Linux builds
      # its fallback editor and runs no npm, so the step is only harmless there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Plugins/Synth/web/package-lock.json

      - name: Build & test (Release, CI build)
        shell: bash
        env:
          CC_COMPILER: ${{ matrix.cc }}
          CXX_COMPILER: ${{ matrix.cxx }}
          OSX_ARCHS: ${{ matrix.osx_archs }}
          DEPLOY: ${{ matrix.deployment_target }}
        run: |
          set -euo pipefail
          args=( -S . -B build-Release -G Ninja
                 -DCMAKE_BUILD_TYPE=Release
                 -DMAKEASOUND_CI_BUILD=ON
                 -DMAKEASOUND_BUILD_APPS=OFF
                 -DMAKEASOUND_BUILD_TESTS=ON )

          # Compiler selection (empty for macOS -> default AppleClang).
          if [ -n "$CC_COMPILER" ]; then
            args+=( -DCMAKE_C_COMPILER="$CC_COMPILER"
                    -DCMAKE_CXX_COMPILER="$CXX_COMPILER" )
          fi

          # macOS universal slices + deployment target. Passing the arch list
          # as a single array element keeps the embedded ';' intact.
          if [ -n "$OSX_ARCHS" ]; then
            args+=( -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCHS"
                    -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOY" )
          fi

          echo "::group::Configure"
          cmake "${args[@]}"
          echo "::endgroup::"

          # Default target: the library plus the test executable (apps are off).
          echo "::group::Build"
          cmake --build build-Release
          echo "::endgroup::"

          # --no-tests=error so a job that stops producing tests fails loudly
          # instead of passing vacuously; --timeout so a case that hangs (a
          # Windows assertion dialog, a wait that never ends) fails in two
          # minutes rather than ctest's default twenty-five.
          echo "::group::Test"
          ctest --test-dir build-Release --build-config Release \
                --output-on-failure --no-tests=error --timeout 120
          echo "::endgroup::"

      # Both example bundles at strictness 10, built by the default target above
      # and handed over as the folder they land in, every editor opened, the
      # Synth's web page included. PluginValidator downloads pluginval on its
      # first run and exits with the number of failures. Linux skips the editor
      # tests: the runner has no display and no Vulkan device for them.
      - name: pluginval (Release)
        if: matrix.pluginval
        shell: bash
        run: |
          set -euo pipefail
          validator=build-Release/Tools/PluginValidator/PluginValidator
          args=(--logs build-Release/pluginval/logs build-Release/VST3)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$validator" --skip-gui-tests "${args[@]}"
          else
            "$validator" "${args[@]}"
          fi

      # Both example components through auval -strict, Gain's bypass property
      # answered: PluginValidator installs each into the runner's
      # ~/Library/Audio/Plug-Ins/Components first. Its logs land beside
      # pluginval's, so the upload below covers them.
      - name: auval (Release)
        if: matrix.pluginval && runner.os == 'macOS'
        shell: bash
        run: |
          build-Release/Tools/PluginValidator/PluginValidator \
            --logs build-Release/pluginval/logs build-Release/AU

      - name: Upload pluginval logs
        if: failure() && matrix.pluginval
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.name }}
          path: build-Release/pluginval/logs/
          if-no-files-found: ignore

      # Prove requirement #1: the archive is a real fat binary and every slice
      # is built against the macOS 11.0 minimum.
      - name: Verify macOS universal + minimum OS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          lib=build-Release/Lib/libMakeASound.a
          echo "Architectures:"
          lipo -info "$lib"
          lipo -info "$lib" | grep -q "x86_64" && lipo -info "$lib" | grep -q "arm64"
          echo "Minimum macOS version per build object:"
          otool -l "$lib" | grep -A3 LC_BUILD_VERSION | grep -E 'minos' | sort -u
          # Fail if any object declares a minos other than 11.0
          if otool -l "$lib" | grep -A3 LC_BUILD_VERSION | grep 'minos' | grep -vq '11.0'; then
            echo "ERROR: found objects with a minos != 11.0"; exit 1
          fi

  # iOS is cross-compiled, so it gets its own job rather than another matrix
  # entry: the configure needs a sysroot/architecture pair, and the suite can
  # only be executed through a booted simulator.
  ios:
    name: iOS (device arm64 + simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      # iOS has WKWebView, so both configures build the Synth's web editor too.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Plugins/Synth/web/package-lock.json

      # Device slices can't be executed in CI, so this half is build-only. It is
      # still the half that catches iOS-specific compile breakage: miniaudio's
      # Objective-C implementation TU and the macOS-only CoreAudio HAL that
      # BlockSizes.mm uses. The examples' apps come out unsigned, each with its
      # AUv3 extension inside, whose plist a macOS sub-build of the plugin cores
      # writes (MakeASoundDescribeBuild).
      - name: Build for iOS device (Release, CI build)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure (device)"
          cmake -S . -B build-ios-Release -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_SYSROOT=iphoneos \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
                -DMAKEASOUND_CI_BUILD=ON \
                -DMAKEASOUND_BUILD_APPS=OFF \
                -DMAKEASOUND_BUILD_TESTS=OFF
          echo "::endgroup::"

          echo "::group::Build (device)"
          cmake --build build-ios-Release
          echo "::endgroup::"

      - name: Verify the device slice really is iOS
        shell: bash
        run: |
          set -euo pipefail
          lib=build-ios-Release/Lib/libMakeASound.a
          echo "Architectures:"
          lipo -info "$lib"
          echo "Platform / minimum OS per build object:"
          otool -l "$lib" | grep -A4 LC_BUILD_VERSION | grep -E 'platform|minos' | sort -u
          # LC_BUILD_VERSION platform 2 is iOS. Catches a build that silently
          # fell back to the host (macOS) toolchain and would then "pass"
          # without ever having compiled the iOS code paths.
          if otool -l "$lib" | grep -A4 LC_BUILD_VERSION \
             | grep 'platform' | grep -vqE 'platform 2$'; then
            echo "ERROR: found objects not built for iOS (platform != 2)"; exit 1
          fi

      - name: Boot an iOS simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          # Pick whatever iPhone the runner image ships rather than hardcoding a
          # model/runtime that image updates would eventually retire.
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          candidates = [d for rt in sorted(devices) for d in devices[rt]
                        if d.get('isAvailable') and 'iPhone' in d['name']]
          print(candidates[0]['udid'] if candidates else '')
          ")

          if [ -z "$udid" ]; then
            echo "ERROR: no iPhone simulator available on this runner"; exit 1
          fi

          echo "Booting simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # `boot` errors out if the device is already booted, which is a
          # perfectly fine state to be in; bootstatus below is the real gate.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      # The simulator is the only place the suite can actually execute for iOS.
      # Both configures build the examples' -Standalone apps too (the default
      # app's iOS shell), and the suite includes the standalone ones.
      # Left non-unity on purpose: between this and the device build above, both
      # the unity and per-TU compile paths get exercised on iOS.
      - name: Build & test on the iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure (simulator)"
          # The simulator slice has to match the runner's own architecture,
          # otherwise the built binary can't be spawned on it.
          cmake -S . -B build-ios-sim -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_SYSROOT=iphonesimulator \
                -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
                -DMAKEASOUND_CI_BUILD=ON \
                -DMAKEASOUND_BUILD_APPS=OFF \
                -DMAKEASOUND_BUILD_TESTS=ON \
                -DCMAKE_CROSSCOMPILING_EMULATOR="xcrun;simctl;spawn;${{ steps.sim.outputs.udid }}"
          echo "::endgroup::"

          echo "::group::Build (simulator)"
          cmake --build build-ios-sim
          echo "::endgroup::"

          # NanoTest can't enumerate cases while cross-compiling, so this is a
          # single ctest entry that runs the whole binary through the simulator.
          # A failing case still propagates out as a non-zero exit.
          echo "::group::Test (simulator)"
          ctest --test-dir build-ios-sim --output-on-failure --no-tests=error --timeout 600
          echo "::endgroup::"

      # Each example's standalone app installed and launched in the simulator, and
      # still running a few seconds later: the scene, the window, the editor (the
      # Synth's web page in WKWebView) and the stream all came up.
      - name: Launch the standalone apps on the iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"

          for app in "Gain/MakeASound Gain" "Synth/MakeASound Synth"; do
            bundle="build-ios-sim/Plugins/${app}.app"
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$bundle/Info.plist")
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$bundle/Info.plist" | grep -qx audio

            xcrun simctl install "$udid" "$bundle"
            pid=$(xcrun simctl launch "$udid" "$id" | awk '{print $NF}')
            sleep 5

            # A live app is listed with its pid; a crashed one with "-" or not at all.
            if ! xcrun simctl spawn "$udid" launchctl list \
                 | awk -v id="$id" '$1 != "-" && index($3, id)' | grep -q .; then
              echo "ERROR: $id (pid $pid) did not stay up"; exit 1
            fi

            xcrun simctl terminate "$udid" "$id"
            echo "$id launched and stayed up"
          done

      # What a host does with each example's AUv3, the apps installed above: the
      # system has registered the extension, instantiates it out of process, it
      # renders sound (Gain fed a sine, the Synth a note) and hands back a view
      # controller. AUv3Probe reads the components from each app's PlugIns and
      # exits with the number that failed.
      - name: AUv3 on the iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          root="$PWD/build-ios-sim"

          for app in "Gain/MakeASound Gain" "Synth/MakeASound Synth"; do
            test -f "$root/Plugins/${app}.app/PlugIns/${app#*/}.appex/Info.plist"
            xcrun simctl install "$udid" "$root/Plugins/${app}.app"
          done

          xcrun simctl spawn "$udid" "$root/Tools/AUv3Probe/AUv3Probe" \
            "$root/Plugins/Gain/MakeASound Gain.app" \
            "$root/Plugins/Synth/MakeASound Synth.app"

  # The same iOS tree under the Xcode generator, which is how a signed device
  # build is made (MAKEASOUND_IOS_TEAM): each app embeds its AUv3 extension with
  # XCODE_EMBED_APP_EXTENSIONS rather than having it laid out by hand. Build only
  # and unsigned, for a device; the Ninja job above is the one that runs things.
  ios-xcode:
    name: iOS (Xcode generator, device, unsigned)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Ninja too: the AUv3 plists' macOS sub-build uses it when it finds it.
      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Plugins/Synth/web/package-lock.json

      - name: Build for iOS device with Xcode (Release, CI build, unsigned)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure (Xcode)"
          cmake -S . -B build-ios-xcode -G Xcode \
                -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
                -DMAKEASOUND_CI_BUILD=ON \
                -DMAKEASOUND_BUILD_APPS=OFF \
                -DMAKEASOUND_BUILD_TESTS=OFF
          echo "::endgroup::"

          echo "::group::Build (Xcode, iphoneos)"
          cmake --build build-ios-xcode --config Release -- \
                -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          echo "::endgroup::"

      # Each app carries its extension, and the extension's plist is the one the
      # host tool wrote, processed by Xcode for the device.
      - name: Verify the embedded AUv3 extensions
        shell: bash
        run: |
          set -euo pipefail
          for app in "Gain/MakeASound Gain" "Synth/MakeASound Synth"; do
            appex="build-ios-xcode/Plugins/${app%%/*}/Release-iphoneos/${app#*/}.app/PlugIns/${app#*/}.appex"
            plist="$appex/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$plist"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:AudioComponents:0:subtype" "$plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms:0" "$plist" | grep -qx iPhoneOS
            otool -l "$appex/${app#*/}" | grep -A4 LC_BUILD_VERSION | grep -qE 'platform 2$'
            echo "$appex: ok"
          done
